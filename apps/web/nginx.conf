server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API al servicio `api` del mismo docker-compose — el
    # navegador nunca le habla directo a otro puerto/host, todo pasa por
    # este mismo origen (evita configurar CORS distinto en producción).
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html para
    # que React Router la resuelva del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
